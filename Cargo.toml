[package]
name = "tapper"
version = "1.0.24"
edition = "2024"
description = "Small Windows helper for Apex tap-strafing with Mouse Wheel."
build = "build.rs"

[[bin]]
name = "Tapper"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
windows-sys = { version = "0.61.2", features = [
  "Win32_Media",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_System_SystemInformation",
  "Win32_UI_Input",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winres = "0.1.12"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
